name: Generate contribution arcade

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: contribution-arcade
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the arcade generator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate and validate both contribution arcade themes
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          python3 -m py_compile scripts/generate_arcade.py
          python3 scripts/generate_arcade.py

      - name: Publish the contribution arcade
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: Update contribution arcade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
